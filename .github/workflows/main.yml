name: Sync Fork

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

env:
  WORK_FOLDER_PATH: ./work
  BUILD_FOLDER_PATH: ./build

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: ${{ env.WORK_FOLDER_PATH }}

      - name: Checkout upstream gh-pages
        uses: actions/checkout@v4
        with:
          repository: Eltirosto/Degrees-of-Lewdity-Chinese-Localization
          ref: gh-pages
          path: ${{ env.BUILD_FOLDER_PATH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: ${{ env.WORK_FOLDER_PATH }}/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: ${{ env.WORK_FOLDER_PATH }}
        run: yarn install --frozen-lockfile

      - name: Build
        working-directory: ${{ env.WORK_FOLDER_PATH }}
        run: yarn run build

      - name: Run replacer
        working-directory: ${{ env.WORK_FOLDER_PATH }}
        run: node src/replacer

      - name: Check BUILD_FOLDER_PATH changes
        id: check_changes
        working-directory: ${{ env.BUILD_FOLDER_PATH }}
        run: |
          git add -N .
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy (orphan history)
        if: steps.check_changes.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.BUILD_FOLDER_PATH }}
          force_orphan: true
